name: Deploy React App

on:
  push:
    branches: [main]

permissions:
  contents: write   # 👈 THIS is the permission

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - run: npm install
      - run: npm run build

      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.Doc_Token }}
          publish_dir: ./dist
